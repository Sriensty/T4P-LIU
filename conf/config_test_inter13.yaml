defaults:
  - hydra: default
  - datamodule: inter_13         # overridden per experiment
  - model: model_ttt_13          # IMPORTANT: _13 variant (historical=10, future=30)

seed: 1234
monitor: val/loss

data_root:
checkpoint:
# Default: inter-trained checkpoint (epoch=50, tr_inter_vl_inter_13)
pretrained_weights: outputs/forecast-mae-ttt-test_False/2025-12-11/09-58-41_NLL_13_tr_inter_vl_lyftsample/checkpoints/epoch=1185.ckpt

output: ${model.name}-${model.phase}

# trainer
num_workers: 4
gpus: 1
sync_bn: true
batch_size: 1
epochs: 60
warmup_epochs: 10

# optimizer
lr: 0.0001
weight_decay: 1e-3
lr2: 0.01
weight_decay2: 1e-3
gradient_clip_val: 15
gradient_clip_algorithm: norm

blacklist: []
whitelist: [
  Embedding,
  Linear,
  Conv1d,
  Conv2d,
  Conv3d,
  MultiheadAttention,
  LSTM,
  GRU,
  BatchNorm1d,
  BatchNorm2d,
  BatchNorm3d,
  SyncBatchNorm,
  LayerNorm,
]

update_param: True

fr_embedding: False
fr_first_layer: False
fr_enc_layer: False
fr_dec_layer: False
fr_last_fore: False
fr_last_mae: False

sep_ego: False
update_type_embed: False

limit_train_batches:
limit_val_batches:
limit_test_batches:
log_model: all
test: true

# TTT frequency: set 999999 to disable, 12 for active TTT
ttt_frequency: 999999
ttt_real_freq: 1

log_frequency: 50
wandb: disable
save_adapted: false

# ---- Anti-forgetting (LwF) ----
lwf_weight: 0.0
lwf_pi_weight: 0.0

# ---- Feature-level LwF ----
lwf_feature_agent_weight: 0.0
lwf_feature_lane_weight: 0.0

# ---- Long-horizon supervision weighting ----
long_horizon_gamma: 0.0
long_horizon_floor: 1.0

# ---- GRPO anti-forgetting (alternative to LwF) ----
use_grpo: false
grpo_reward: obs_ade      # "obs_ade" | "ade" | "fde"
grpo_kl_beta: 0.1         # KL penalty weight (mode distribution)
grpo_feat_beta: 0.0       # feature anchor weight (x_agent MSE, 0=disabled)

# ---- On-Policy Distillation (OPD) ----
use_opd: false
opd_weight: 0.003     # loss scale: try 0.001 / 0.003 / 0.01
opd_sigma: 2.0        # GMM bandwidth (metres); controls teacher strictness

# ---- Selective Feature LwF ----
use_sel_lwf: false
sel_lwf_mode: source_drift_weighted   # source_drift_weighted | source_dominant_weighted | target_adaptive_masked
sel_lwf_drift_data: outputs/drift_analysis/drift_data.npz
sel_lwf_mask_ratio: 1.2    # target_adaptive_masked: tgt/src ratio threshold
sel_lwf_mask_val: 0.0      # weight assigned to masked dims (0 = full suppress)

# ---- Encoder lower LR (Task 1) ----
encoder_lr_scale: 1.0      # 1.0 = unchanged; try 0.1 / 0.01

# ---- Encoder L2-SP (Task 2) ----
l2sp_weight: 0.0           # try 1e-5 / 1e-4 / 1e-3

# ---- Multi-layer feature LwF (Task 3) ----
lwf_feature_full_encoder_weight: 0.0   # all x_encoder_deep tokens
lwf_feature_shallow_weight: 0.0        # x_encoder pre-blocks

# ---- Deep-feature residual adapter ----
# adapter arch (Linear(embed_dim, deep_adapter_dim)->ReLU->Linear->embed_dim)
# is set via model.target.deep_adapter_dim (default 32); these are runtime toggles.
use_deep_adapter: false
deep_adapter_alpha: 1.0
deep_adapter_detach_base: false   # true = decoder/MAE input uses base.detach()+delta,
                                  # isolating encoder from downstream task-loss gradient
freeze_encoder_backbone: false    # true = net.blocks + net.norm frozen (requires_grad=False);
                                  # adapter/decoder/memory/MAE decoder-head still update
freeze_encoder_blocks: "none"     # "none" | "first_50%" | "first_75%" | "all" | explicit list, e.g. [0,1]
adapter_lr_scale: 1.0             # LR multiplier for net.deep_adapter.* params

desc: inter_cross_domain_test
